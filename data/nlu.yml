version: "3.1"

# nlu = natural language understanding
# This file defines intents (what users want to do) with training examples:
# Intent: The purpose behind a user's message (e.g., greet, goodbye)
# Examples: Sample phrases users might say for each intent

nlu:
- intent: greet
  examples: |
    - hola
    - buenos días
    - buenas tardes
    - buenas noches
    - hey
    - qué tal
    - saludos
    - hola chatbot
    - buen día
    - buenas

- intent: goodbye
  examples: |
    - adiós
    - hasta luego
    - nos vemos
    - chao
    - bye
    - hasta la vista
    - que tengas buen día
    - hasta pronto
    - me voy
    - gracias y adiós

- intent: affirm
  examples: |
    - sí
    - claro
    - por supuesto
    - exacto
    - correcto
    - afirmativo
    - vale
    - ok
    - está bien
    - de acuerdo

- intent: deny
  examples: |
    - no
    - nunca
    - para nada
    - no creo
    - no me parece
    - no es así
    - negativo
    - no, gracias

- intent: mood_great
  examples: |
    - perfecto
    - genial
    - fantástico
    - me siento genial
    - estoy muy bien
    - excelente
    - maravilloso
    - súper bien
    - increíble

- intent: mood_unhappy
  examples: |
    - mi día fue horrible
    - estoy triste
    - no me siento bien
    - estoy decepcionado
    - muy triste
    - no muy bien
    - fatal
    - mal día

- intent: bot_challenge
  examples: |
    - eres un bot?
    - eres humano?
    - estoy hablando con un bot?
    - eres una máquina?
    - qué eres?

- intent: consultar_asignatura
  examples: |
    - quiero información sobre [2050001](codigo_asignatura)
    - dime sobre la asignatura [2050024](codigo_asignatura)
    - qué puedes decirme de [2050010](codigo_asignatura)
    - información de [2050046](codigo_asignatura)
    - consultar [2050030](codigo_asignatura)
    - buscar asignatura [2050048](codigo_asignatura)
    - datos de la asignatura [2050039](codigo_asignatura)
    - cuéntame sobre [2050051](codigo_asignatura)
    - necesito info de [2050020](codigo_asignatura)
    - mostrar [2050033](codigo_asignatura)
    - ver asignatura [2050045](codigo_asignatura)
    - detalles de [2050037](codigo_asignatura)
    - quiero saber sobre la materia [2050012](codigo_asignatura)
    - qué es [2050003](codigo_asignatura)
