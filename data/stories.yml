version: "3.1"

# These define conversation flows - sequences of user intents and bot actions:
# They show how conversations should progress
# Help train the dialogue management model

stories:

- story: happy path
  steps:
  - intent: greet
  - action: utter_greet
  - intent: mood_great
  - action: utter_happy

- story: sad path 1
  steps:
  - intent: greet
  - action: utter_greet
  - intent: mood_unhappy
  - action: utter_cheer_up
  - action: utter_did_that_help
  - intent: affirm
  - action: utter_happy

- story: sad path 2
  steps:
  - intent: greet
  - action: utter_greet
  - intent: mood_unhappy
  - action: utter_cheer_up
  - action: utter_did_that_help
  - intent: deny
  - action: utter_goodbye

- story: consultar asignatura con saludo
  steps:
  - intent: greet
  - action: utter_greet
  - intent: consultar_asignatura
    entities:
    - codigo_asignatura: "IS2"
  - slot_was_set:
    - codigo_asignatura: "IS2"
  - action: action_consultar_asignatura
  - intent: goodbye
  - action: utter_goodbye

- story: consultar asignatura directa
  steps:
  - intent: consultar_asignatura
    entities:
    - codigo_asignatura: "2050001"
  - slot_was_set:
    - codigo_asignatura: "2050001"
  - action: action_consultar_asignatura

- story: pedir info asignatura y luego dar código
  steps:
  - intent: pedir_info_asignatura
  - action: utter_pedir_codigo
  - intent: consultar_asignatura
    entities:
    - codigo_asignatura: "2050001"
  - action: action_consultar_asignatura

- story: consulta con seguimiento
  steps:
  - intent: consultar_asignatura
    entities:
    - codigo_asignatura: "2050001"
  - action: action_consultar_asignatura
  - intent: pregunta_seguimiento
    entities:
    - atributo_asignatura: "créditos"
  - action: action_pregunta_seguimiento
