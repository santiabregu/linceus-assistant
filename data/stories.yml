version: "3.1"

stories:

# ══════════════════════════════════════════════════════════════════════════════
# GENERAL - Saludos y estados de ánimo
# ══════════════════════════════════════════════════════════════════════════════

- story: usuario contento
  steps:
  - intent: greet
  - action: utter_greet
  - intent: mood_great
  - action: utter_happy

- story: usuario triste - se anima
  steps:
  - intent: greet
  - action: utter_greet
  - intent: mood_unhappy
  - action: utter_cheer_up
  - action: utter_did_that_help
  - intent: affirm
  - action: utter_happy

- story: usuario triste - sigue triste
  steps:
  - intent: greet
  - action: utter_greet
  - intent: mood_unhappy
  - action: utter_cheer_up
  - action: utter_did_that_help
  - intent: deny
  - action: utter_goodbye

# ══════════════════════════════════════════════════════════════════════════════
# ASIGNATURAS - Consultas sobre asignaturas
# ══════════════════════════════════════════════════════════════════════════════

- story: consultar asignatura con saludo
  steps:
  - intent: greet
  - action: utter_greet
  - intent: consultar_asignatura
    entities:
    - codigo_asignatura: "IS2"
  - slot_was_set:
    - codigo_asignatura: "IS2"
  - action: action_consultar_asignatura
  - intent: goodbye
  - action: utter_goodbye

- story: consultar asignatura por código
  steps:
  - intent: consultar_asignatura
    entities:
    - codigo_asignatura: "2050001"
  - slot_was_set:
    - codigo_asignatura: "2050001"
  - action: action_consultar_asignatura

- story: consultar asignatura por nombre
  steps:
  - intent: consultar_asignatura
    entities:
    - nombre_asignatura: "Fundamentos de Programación"
  - slot_was_set:
    - nombre_asignatura: "Fundamentos de Programación"
  - action: action_consultar_asignatura

- story: consulta asignatura con seguimiento
  steps:
  - intent: consultar_asignatura
    entities:
    - codigo_asignatura: "2050001"
  - action: action_consultar_asignatura
  - intent: pregunta_seguimiento
    entities:
    - atributo_asignatura: "créditos"
  - action: action_pregunta_seguimiento

