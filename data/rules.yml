version: "3.1"

rules:

- rule: Saludar al usuario
  steps:
  - intent: greet
  - action: utter_greet

- rule: Despedirse del usuario
  steps:
  - intent: goodbye
  - action: utter_goodbye

- rule: Responder que soy un bot
  steps:
  - intent: bot_challenge
  - action: utter_iamabot

- rule: Mostrar ayuda
  steps:
  - intent: pedir_ayuda
  - action: utter_ayuda

- rule: Respuesta por defecto
  steps:
  - intent: nlu_fallback
  - action: utter_default

- rule: Cambiar contexto academico
  steps:
  - intent: cambiar_contexto_academico
  - action: action_cambiar_contexto

- rule: Consultar contexto academico
  steps:
  - intent: consultar_contexto_academico
  - action: action_consultar_contexto

- rule: Consultar asignatura
  steps:
  - intent: consultar_asignatura_db
  - action: action_consultar_asignatura_db

- rule: Mostrar todas las asignaturas
  steps:
  - intent: pedir_mas_resultados
  - action: action_mostrar_todas_asignaturas

- rule: Mostrar todas con afirmacion
  steps:
  - intent: affirm
  - action: action_mostrar_todas_asignaturas
  condition:
  - slot_was_set:
    - ultimos_resultados_asignaturas
