version: "3.1"

rules:

- rule: Say goodbye anytime the user says goodbye
  steps:
  - intent: goodbye
  - action: utter_goodbye

- rule: Say 'I am a bot' anytime the user challenges
  steps:
  - intent: bot_challenge
  - action: utter_iamabot

- rule: Always greet back
  steps:
  - intent: greet
  - action: utter_greet

- rule: Consultar asignatura cuando se proporciona código
  steps:
  - intent: consultar_asignatura
  - action: action_consultar_asignatura

- rule: Pregunta de seguimiento sobre última asignatura
  steps:
  - intent: pregunta_seguimiento
  - action: action_pregunta_seguimiento

- rule: Pedir código cuando no se proporciona
  steps:
  - intent: pedir_info_asignatura
  - action: utter_pedir_codigo
