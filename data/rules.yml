version: "3.1"

rules:

- rule: Saludar al usuario
  steps:
  - intent: greet
  - action: utter_greet

- rule: Despedirse del usuario
  steps:
  - intent: goodbye
  - action: utter_goodbye

- rule: Responder que soy un bot
  steps:
  - intent: bot_challenge
  - action: utter_iamabot

- rule: Mostrar ayuda
  steps:
  - intent: pedir_ayuda
  - action: utter_ayuda

- rule: Respuesta por defecto
  steps:
  - intent: nlu_fallback
  - action: utter_default

- rule: Pregunta fuera de ambito
  steps:
  - intent: out_of_scope
  - action: utter_default

- rule: Cambiar contexto academico
  steps:
  - intent: cambiar_contexto_academico
  - action: action_cambiar_contexto

- rule: Consultar contexto academico
  steps:
  - intent: consultar_contexto_academico
  - action: action_consultar_contexto

- rule: Consulta de titulaciones disponibles
  steps:
  - intent: consulta_titulaciones
  - action: action_consulta_titulaciones

# =============================================================================
# REGLAS PARA CONSULTAS DE ASIGNATURAS (Text-to-SQL)
# =============================================================================

- rule: Consulta especifica de asignatura
  steps:
  - intent: consulta_asignatura_especifica
  - action: action_consulta_especifica

- rule: Listado de asignaturas
  steps:
  - intent: consulta_asignaturas_listado
  - action: action_consulta_listado

- rule: Conteo de asignaturas
  steps:
  - intent: consulta_asignaturas_conteo
  - action: action_consulta_conteo

- rule: Mostrar todas las asignaturas
  steps:
  - intent: pedir_mas_resultados
  - action: action_mostrar_todas_asignaturas

- rule: Consulta de horario
  steps:
  - intent: consulta_horario
  - action: action_consulta_horario

- rule: Mostrar todas con afirmacion
  steps:
  - intent: affirm
  - action: action_mostrar_todas_asignaturas
  condition:
  - slot_was_set:
    - ultimos_resultados_asignaturas
