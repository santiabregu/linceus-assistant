services:
  # Rasa + Actions combinados
  - type: web
    name: linceus-rasa
    runtime: docker
    dockerfilePath: Dockerfile.render
    plan: free
    envVars:
      - fromGroup: linceus-env

envVarGroups:
  - name: linceus-env
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: DEFAULT_UNIVERSIDAD_CODIGO
        value: US
      - key: DEFAULT_CENTRO_CODIGO
        value: ETSII
      - key: DEFAULT_TITULACION_CODIGO
        value: GII-IS
