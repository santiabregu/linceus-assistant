version: "3.1"

intents:
  - greet
  - goodbye
  - affirm
  - deny
  - mood_great
  - mood_unhappy
  - bot_challenge
  - pedir_ayuda
  - nlu_fallback
  - cambiar_contexto_academico
  - consultar_contexto_academico
  - consultar_asignatura_db
  - pedir_mas_resultados

entities:
  - nombre_centro
  - nombre_titulacion
  - nombre_asignatura
  - atributo_asignatura
  - filtro_curso
  - filtro_tipologia
  - filtro_duracion
  - filtro_creditos

slots:
  contexto_centro:
    type: text
    influence_conversation: false
    mappings:
    - type: custom

  contexto_titulacion:
    type: text
    influence_conversation: false
    mappings:
    - type: custom

  ultimo_codigo_consultado:
    type: text
    influence_conversation: false
    mappings:
    - type: custom

  ultimo_nombre_asignatura:
    type: text
    influence_conversation: false
    mappings:
    - type: custom

  ultimos_resultados_asignaturas:
    type: any
    influence_conversation: false
    mappings:
    - type: custom

  asignaturas_memoria:
    type: any
    influence_conversation: false
    mappings:
    - type: custom

responses:
  utter_greet:
  - text: "Hola! Soy tu asistente universitario. En que puedo ayudarte?"
  - text: "Hola! Que tal? Estoy aqui para ayudarte con info de asignaturas."
  - text: "Hey! Soy Linceus, tu asistente de la ETSII. Que necesitas saber?"

  utter_goodbye:
  - text: "Hasta luego! Que tengas un buen dia."

  utter_iamabot:
  - text: "Soy un chatbot universitario creado con Rasa para ayudarte con informacion academica."

  utter_happy:
  - text: "Perfecto! Hay algo mas en lo que pueda ayudarte?"

  utter_cheer_up:
  - text: "Aqui tienes algo para animarte:"
    image: "https://i.imgur.com/nGF1K8f.jpg"

  utter_did_that_help:
  - text: "Te ha sido util esta informacion?"

  utter_ayuda:
  - text: |
      **Soy Linceus, tu asistente de la ETSII.** Puedo ayudarte con:

      **Asignaturas:**
      - "Hablame de Redes de Computadores"
      - "Cuantos creditos tiene IS2?"
      - "Que asignaturas obligatorias hay en primero?"
      - "Dame las optativas de cuarto"

      **Contexto academico:**
      - "Que carrera estoy consultando?"
      - "Cambiar a Tecnologias Informaticas"

      Preguntame lo que necesites!

  utter_default:
  - text: |
      No estoy seguro de entender tu pregunta.

      Puedo ayudarte con informacion sobre **asignaturas**:
      - Creditos ECTS
      - Curso (1, 2, 3, 4)
      - Tipo (obligatoria, optativa, formacion basica)
      - Cuatrimestre (anual, C1, C2)

      Prueba preguntando:
      - "Cuantos creditos tiene Redes?"
      - "Dame las optativas de cuarto"
      - "Que asignaturas hay en primero?"

  utter_no_contexto:
  - text: "No recuerdo de que asignatura hablabamos. Puedes decirme el nombre?"

actions:
  - action_cambiar_contexto
  - action_consultar_contexto
  - action_consultar_asignatura_db
  - action_mostrar_todas_asignaturas

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true
