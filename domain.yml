version: "3.1"

intents:
  - greet
  - goodbye
  - affirm
  - deny
  - mood_great
  - mood_unhappy
  - bot_challenge
  - pedir_ayuda
  - nlu_fallback
  - cambiar_contexto_academico
  - consultar_contexto_academico
  - consulta_titulaciones
  # Intents separados para asignaturas (Text-to-SQL)
  - consulta_asignatura_especifica   # "¿Cuántos créditos tiene Redes?"
  - consulta_asignaturas_listado     # "Dame las optativas de cuarto"
  - consulta_asignaturas_conteo      # "¿Cuántas asignaturas hay en primero?"
  - pedir_mas_resultados
  # Horarios
  - consulta_horario                 # "¿Qué horario tiene 2º grupo 1?"
  # Profesores
  - consulta_profesor                # "¿Quién da FP?" / "tutorías de Parejo"
  # Multi-intent (combinaciones)
  - cambiar_contexto_academico+consulta_horario
  - cambiar_contexto_academico+consulta_asignatura_especifica
  - cambiar_contexto_academico+consulta_asignaturas_listado
  - cambiar_contexto_academico+consulta_asignaturas_conteo
  - consulta_horario+consulta_asignatura_especifica
  - consulta_asignatura_especifica+consulta_asignaturas_listado
  - out_of_scope

entities:
  - nombre_centro
  - nombre_titulacion
  - nombre_asignatura
  - nombre_profesor
  - nombre_departamento
  - atributo_asignatura
  - filtro_curso
  - filtro_tipologia
  - filtro_duracion
  - filtro_creditos

slots:
  contexto_centro:
    type: text
    influence_conversation: false
    mappings:
    - type: custom

  contexto_titulacion:
    type: text
    influence_conversation: false
    mappings:
    - type: custom

  ultimo_codigo_consultado:
    type: text
    influence_conversation: false
    mappings:
    - type: custom

  ultimo_nombre_asignatura:
    type: text
    influence_conversation: false
    mappings:
    - type: custom

  ultimos_resultados_asignaturas:
    type: any
    influence_conversation: false
    mappings:
    - type: custom

  asignaturas_memoria:
    type: any
    influence_conversation: false
    mappings:
    - type: custom

  ultima_action_ejecutada:
    type: text
    influence_conversation: false
    mappings:
    - type: custom

  ultimo_profesor_consultado:
    type: text
    influence_conversation: false
    mappings:
    - type: custom

  feedback_rating:
    type: text
    influence_conversation: false
    mappings:
    - type: custom

  feedback_comment:
    type: text
    influence_conversation: false
    mappings:
    - type: custom

responses:
  utter_greet:
  - text: "¡Hola! Soy **Linceus**, el asistente virtual de la ETSII (Universidad de Sevilla). ¿En qué puedo ayudarte hoy?\n\nAntes de empezar, por favor indícame tu titulación:"
    buttons:
    - title: "Ingeniería del Software (GII-IS)"
      payload: "GII-IS"
    - title: "Tecnologías Informáticas (GII-TI)"
      payload: "GII-TI"
    - title: "Ingeniería de Computadores (GII-IC)"
      payload: "GII-IC"

  utter_goodbye:
  - text: "Hasta luego! Que tengas un buen dia."

  utter_iamabot:
  - text: "Soy un chatbot universitario creado con Rasa para ayudarte con informacion academica."

  utter_happy:
  - text: "Perfecto! Hay algo mas en lo que pueda ayudarte?"

  utter_cheer_up:
  - text: "Aqui tienes algo para animarte:"
    image: "https://i.imgur.com/nGF1K8f.jpg"

  utter_did_that_help:
  - text: "Te ha sido util esta informacion?"

  utter_ayuda:
  - text: |
      **Soy Linceus, tu asistente de la ETSII.** Puedo ayudarte con:

      **Asignaturas:**
      - "Háblame de Redes de Computadores"
      - "Cuántos créditos tiene IS2?"
      - "Qué asignaturas obligatorias hay en primero?"
      - "Dame las optativas de cuarto"

      **Horarios:**
      - "¿Qué horario tiene 2º grupo 1?"
      - "¿En qué aula tengo FP?"
      - "¿Qué clases hay los lunes en primero?"

      **Profesores:**
      - "¿Quién da clase de FP?"
      - "Tutorías del profesor Parejo"
      - "Correo de la profesora Diana"
      - "¿En qué despacho está Ruiz Cortés?"

      **Contexto académico:**
      - "Qué carrera estoy consultando?"
      - "Cambiar a Tecnologías Informáticas"

      ⚠️ Recuerda indicar tu titulación para que las consultas sean correctas.

      ¡Pregúntame lo que necesites!

  utter_default:
  - text: |
      No estoy seguro de entender tu pregunta. Puedo ayudarte con informacion sobre **asignaturas** de la ETSII.

      Prueba preguntando cosas como:
      - "Cuantos creditos tiene Redes?"
      - "Dame las optativas de cuarto"
      - "Que asignaturas hay en primero?"

      Tambien te pueden ser utiles estos enlaces:
      - [SEVIUS - Portal del Estudiante](https://sevius.us.es)
      - [Universidad de Sevilla](https://www.us.es)

  utter_pedir_titulacion:
  - text: |
      Antes de consultar asignaturas, necesito saber tu titulación:

      • **Ingeniería del Software** (IS)
      • **Tecnologías Informáticas** (TI)
      • **Ingeniería de Computadores** (IC)

      Dime cuál cursas.

  utter_no_contexto:
  - text: "No recuerdo de qué asignatura hablábamos. ¿Puedes decirme el nombre?"

actions:
  - action_cambiar_contexto
  - action_consultar_contexto
  - action_consulta_titulaciones
  # Actions separadas para Text-to-SQL
  - action_consulta_especifica      # Consulta sobre UNA asignatura
  - action_consulta_listado         # Listar asignaturas con filtros
  - action_consulta_conteo          # Contar asignaturas
  - action_mostrar_todas_asignaturas
  # Horarios
  - action_consulta_horario
  # Profesores
  - action_consulta_profesor
  # Multi-intent
  - action_multi_intent
  # Fallback inteligente
  - action_smart_fallback

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true
