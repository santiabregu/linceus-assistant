version: "3.1"

# ══════════════════════════════════════════════════════════════════════════════
# INTENTS
# ══════════════════════════════════════════════════════════════════════════════

intents:
 
  # General - Saludos, despedidas, estados de ánimo
  - greet
  - goodbye
  - affirm
  - deny
  - mood_great
  - mood_unhappy
  - bot_challenge
  - pedir_ayuda

 
  # Contexto académico - Centro y titulación
  - cambiar_contexto_academico
  - consultar_contexto_academico

  # Asignaturas
  - consultar_asignatura
  - pregunta_seguimiento
  - consultar_asignaturas_filtradas
  - pedir_mas_resultados

  # Profesores (futuro)

  # Horarios (futuro)

  # Trámites (futuro)


# ══════════════════════════════════════════════════════════════════════════════
# ENTITIES
# ══════════════════════════════════════════════════════════════════════════════

entities:

  # Contexto académico
  - nombre_centro
  - nombre_titulacion

  # Asignaturas
  - codigo_asignatura
  - nombre_asignatura
  - atributo_asignatura
  - filtro_curso
  - filtro_tipologia
  - filtro_duracion
  - filtro_titulacion
  - filtro_creditos

  # Profesores (futuro)

  # Horarios (futuro)


# ══════════════════════════════════════════════════════════════════════════════
# SLOTS
# ══════════════════════════════════════════════════════════════════════════════

slots:

  # Contexto académico - Centro y titulación seleccionados
  contexto_centro:
    type: text
    influence_conversation: false
    mappings:
    - type: custom
  
  contexto_titulacion:
    type: text
    influence_conversation: false
    mappings:
    - type: custom

  contexto_dominio:
    type: text
    influence_conversation: false
    mappings:
    - type: custom


  # Asignaturas - Datos de consulta
  codigo_asignatura:
    type: text
    influence_conversation: true
    mappings:
    - type: from_entity
      entity: codigo_asignatura
  
  nombre_asignatura:
    type: text
    influence_conversation: true
    mappings:
    - type: from_entity
      entity: nombre_asignatura
  
  atributo_asignatura:
    type: text
    influence_conversation: false
    mappings:
    - type: from_entity
      entity: atributo_asignatura
  
  ultimo_codigo_consultado:
    type: text
    influence_conversation: false
    mappings:
    - type: custom
  
  ultimo_nombre_asignatura:
    type: text
    influence_conversation: false
    mappings:
    - type: custom


  # Asignaturas - Filtros para consultas múltiples
  filtro_curso:
    type: text
    influence_conversation: false
    mappings:
    - type: from_entity
      entity: filtro_curso
  
  filtro_tipologia:
    type: text
    influence_conversation: false
    mappings:
    - type: from_entity
      entity: filtro_tipologia
  
  filtro_duracion:
    type: text
    influence_conversation: false
    mappings:
    - type: from_entity
      entity: filtro_duracion
  
  filtro_titulacion:
    type: text
    influence_conversation: false
    mappings:
    - type: from_entity
      entity: filtro_titulacion
  
  filtro_creditos:
    type: text
    influence_conversation: false
    mappings:
    - type: from_entity
      entity: filtro_creditos

  # Asignaturas - Últimos filtros usados (para "ver todas")
  ultimos_filtros_curso:
    type: any
    influence_conversation: false
    mappings:
    - type: custom
  
  ultimos_filtros_tipologia:
    type: text
    influence_conversation: false
    mappings:
    - type: custom
  
  ultimos_filtros_duracion:
    type: text
    influence_conversation: false
    mappings:
    - type: custom
  
  ultimos_filtros_creditos:
    type: any
    influence_conversation: false
    mappings:
    - type: custom

  # Profesores (futuro)

  # Horarios (futuro)


# ══════════════════════════════════════════════════════════════════════════════
# RESPONSES
# ══════════════════════════════════════════════════════════════════════════════

responses:

  # General
  utter_greet:
  - text: "¡Hola! Soy tu asistente universitario. ¿En qué puedo ayudarte?"
  - text: "¡Hola! ¿Qué tal? Estoy aquí para ayudarte con info de asignaturas, horarios y más."
  - text: "¡Hey! Soy Linceus, tu asistente de la ETSII. ¿Qué necesitas saber?"

  utter_goodbye:
  - text: "¡Hasta luego! Que tengas un buen día."

  utter_iamabot:
  - text: "Soy un chatbot universitario creado con Rasa para ayudarte con información académica."

  utter_happy:
  - text: "¡Perfecto! ¿Hay algo más en lo que pueda ayudarte?"

  utter_cheer_up:
  - text: "Aquí tienes algo para animarte:"
    image: "https://i.imgur.com/nGF1K8f.jpg"

  utter_did_that_help:
  - text: "¿Te ha sido útil esta información?"

  utter_ayuda:
  - text: |
      🎓 **Soy Linceus, tu asistente de la ETSII.** Puedo ayudarte con:
      
      📚 **Asignaturas:**
      • "Háblame de Redes de Computadores"
      • "¿Cuántos créditos tiene IS2?"
      • "¿Qué asignaturas obligatorias hay en primero?"
      • "Dame las optativas de cuarto"
      
      🎯 **Contexto académico:**
      • "¿Qué carrera estoy consultando?"
      • "Cambiar a Tecnologías Informáticas"
      
      ¡Pregúntame lo que necesites!


  # Asignaturas
  utter_pedir_codigo:
  - text: "¿Qué asignatura te interesa? Puedes decirme el nombre o el código."
  - text: "Dime el nombre o código de la asignatura que quieres consultar."
  - text: "¿De qué asignatura quieres información? Puedes darme el nombre o el código."

  utter_no_contexto:
  - text: "No recuerdo de qué asignatura hablábamos. ¿Puedes decirme el nombre o código?"
  - text: "No tengo claro a qué asignatura te refieres. ¿Me dices cuál es?"

  utter_consultar_asignatura:
  - text: "¿Qué asignatura quieres consultar? Puedes darme el nombre o el código."
  - text: "Dime qué asignatura te interesa y te cuento todo sobre ella."

  # Profesores (futuro)

  # Horarios (futuro)


# ══════════════════════════════════════════════════════════════════════════════
# ACTIONS
# ══════════════════════════════════════════════════════════════════════════════

actions:

  # General / Debug
  - action_test_supabase

  # Contexto académico
  - action_cambiar_contexto
  - action_consultar_contexto

  # Asignaturas
  - action_consultar_asignatura
  - action_pregunta_seguimiento
  - action_consultar_asignaturas_filtradas
  - action_mostrar_todas

  # Profesores (futuro)

  # Horarios (futuro)


# ══════════════════════════════════════════════════════════════════════════════
# SESSION CONFIG
# ══════════════════════════════════════════════════════════════════════════════

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true
