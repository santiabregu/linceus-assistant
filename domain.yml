version: "3.1"

# This is like the "vocabulary" of your bot:
# Lists all intents your bot can understand
# Defines responses (what the bot can say)
# Specifies entities, slots, and actions


intents:
  - greet
  - goodbye
  - affirm
  - deny
  - mood_great
  - mood_unhappy
  - bot_challenge
  - consultar_asignatura
  - pregunta_seguimiento
  - pedir_info_asignatura

entities:
  - codigo_asignatura
  - nombre_asignatura
  - atributo_asignatura

slots:
  codigo_asignatura:
    type: text
    influence_conversation: true
    mappings:
    - type: from_entity
      entity: codigo_asignatura
  
  nombre_asignatura:
    type: text
    influence_conversation: true
    mappings:
    - type: from_entity
      entity: nombre_asignatura
  
  atributo_asignatura:
    type: text
    influence_conversation: false
    mappings:
    - type: from_entity
      entity: atributo_asignatura
  
  ultimo_codigo_consultado:
    type: text
    influence_conversation: false
    mappings:
    - type: custom
  
  ultimo_nombre_asignatura:
    type: text
    influence_conversation: false
    mappings:
    - type: custom

responses:
  utter_greet:
  - text: "¡Hola! Soy tu asistente universitario. ¿En qué puedo ayudarte?"
  - text: "¡Hola! ¿Qué tal? Estoy aquí para ayudarte con info de asignaturas, horarios y más."
  - text: "¡Hey! Soy Linceus, tu asistente de la ETSII. ¿Qué necesitas saber?"

  utter_cheer_up:
  - text: "Here is something to cheer you up:"
    image: "https://i.imgur.com/nGF1K8f.jpg"

  utter_did_that_help:
  - text: "¿Te ha sido útil esta información?"

  utter_happy:
  - text: "¡Perfecto! ¿Hay algo más en lo que pueda ayudarte?"

  utter_goodbye:
  - text: "¡Hasta luego! Que tengas un buen día."

  utter_iamabot:
  - text: "Soy un chatbot universitario creado con Rasa para ayudarte con información académica."

  utter_pedir_codigo:
  - text: "¿Qué asignatura te interesa? Puedes decirme el nombre o el código."
  - text: "Dime el nombre o código de la asignatura que quieres consultar."
  - text: "¿De qué asignatura quieres información? Puedes darme el nombre o el código."

  utter_no_contexto:
  - text: "No recuerdo de qué asignatura hablábamos. ¿Puedes decirme el nombre o código?"
  - text: "No tengo claro a qué asignatura te refieres. ¿Me dices cuál es?"

  utter_consultar_asignatura:
  - text: "¿Qué asignatura quieres consultar? Puedes darme el nombre o el código."
  - text: "Dime qué asignatura te interesa y te cuento todo sobre ella."

actions:
  - action_test_supabase
  - action_consultar_asignatura
  - action_pregunta_seguimiento
  - action_pedir_info_asignatura

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true
